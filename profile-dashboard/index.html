<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <!--==================================
    ===== Header and Theme Select ========
    ===================================-->
    <header>
        <h3>Titulo???</h3>
        <div class="themeDisplay">
            <button id="selectTema">
                <img id="themeIcon"src="ProfilePics/moon.png">
            </button>
        </div>
    </header>
    <!--==================================
    ============ Main Container ==========
    ===================================-->
    <main>
        <!-- Defining profile Container-->
        <div id="profileContainer">
            <div id="wrapper">
                <img src="ProfilePics/1.png" id="avatarDisplay">
                <button id="editButton">
                    <img src="ProfilePics/edit.png">
                </button>
            </div>
        </div>
        <!-- Neds to define the rest of-->
        <div id="formsContainer"></div>
    </main>
    
    <div id="modalMenu" class="hidden">
        <main id="charContainer">
            <div class="charDisplayCard" id="0">
                <img src="ProfilePics/1.png">
            </div>
            <div class="charDisplayCard" id="1">
                <img src="ProfilePics/2.png">
            </div>
            <div class="charDisplayCard" id="2">
                <img src="ProfilePics/3.png">
            </div>
        </main>
        <button id="closeModal">Close</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
