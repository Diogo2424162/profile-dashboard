<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <!--==================================
    ===== Header and Theme Select ========
    ===================================-->
    <header class="dark">
        <h3 class="dark">Profile Dashboard</h3>
        <div class="themeDisplay">
            <div>Theme: </div>
            <select id="selectTema">
                <option value="dark" selected>Dark</option>
                <option value="light">Light</option>
            </select>
        </div>
    </header>
    <!--==================================
    ============ Main Container ==========
    ===================================-->
    <main>
        <!-- Defining profile Container-->
        <div id="profileContainer">
            <img src="" id="avatarDisplay">
            <br>
            <button class="dark">Change Avatar</button>
        </div>
        <!-- Neds to define the rest of-->
    </main>

    <script src="script.js"></script>
</body>
</html>
